<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Générateur de cards</title>
    <link href="./styles.css" rel="stylesheet" />
  </head>

  <body>
    <p id="empty-state" class="empty"></p>

    <div id="app" class="app">
      <aside class="sidebar">
        <div id="template-picker-wrap" class="field field--template">
          <label for="template-picker">Template</label>
          <select id="template-picker" class="template-select"></select>
        </div>

        <div id="form-fields"></div>

        <button type="button" id="copy-btn" class="copy-btn">
          <svg
            class="copy-btn__icon copy-btn__icon--default"
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="9" y="9" width="12" height="12" rx="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <svg
            class="copy-btn__icon copy-btn__icon--done"
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span class="copy-btn__label">Copier le code</span>
        </button>
        <button type="button" id="toggle-code" class="link-btn">
          Afficher le code
        </button>

        <p class="hint">
          Le code copié est autonome (styles isolés dans une balise
          &lt;style&gt; préfixée) : colle-le dans un élément Embed ou dans un
          champ Rich Text du CMS.
        </p>
        <p id="site-id" class="site-id"></p>
      </aside>

      <main class="preview">
        <p class="preview__label">Aperçu</p>
        <iframe
          id="preview-frame"
          class="preview-frame"
          title="Aperçu de la card"
        ></iframe>
        <div id="code-panel" class="code-panel">
          <p class="preview__label">Code généré</p>
          <textarea id="code-output" readonly spellcheck="false"></textarea>
        </div>
      </main>
    </div>

    <script type="module" src="index.js"></script>
  </body>
</html>
